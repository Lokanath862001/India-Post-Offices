# AGY Interactive Auto-Response Agent Configuration

# Default action when AGY prompts with exactly 2 options
TWO_OPTION_RESPONSE=1

# Default action when AGY prompts with exactly 4 options
FOUR_OPTION_RESPONSE=2

# Whether to automatically generate Ctrl+K keypress when approval is requested
CTRL_K_APPROVAL=true

# Whether to automatically send Enter key after choosing option 1 or 2
AUTO_ENTER=true

# Polling interval in milliseconds (low latency, zero human-noticeable delay)
POLL_INTERVAL_MS=20

# Debug mode for verbose logging
DEBUG_MODE=false

# Filter processes to monitor (comma-separated, case-insensitive)
TARGET_PROCESS_NAMES=agy,antigravity,powershell,pwsh,cmd,WindowsTerminal

# Fingerprint cache expiry in seconds
FINGERPRINT_TTL_SECONDS=30
